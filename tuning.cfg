; ─────────────────────────────────────────────────────────────────────────────
;  MISSILE RIDER — TUNING
;
;  Every gameplay-feel value in the game lives here and nowhere else. Save this
;  file and a running game picks it up immediately; no restart, no rebuild.
;
;  Comments start with ';' and may sit at the end of a value line. '#' is NOT a
;  comment character here — it gets parsed into the next key and breaks the file.
;
;  Types are Godot literals: 90.0 float, 100 int, "text" string, Vector3(x, y, z).
;  Colours are hex strings.
;
;  Nothing here is a decision. These are starting positions for a tuning session.
;  See CLAUDE.md (feel-parameter law), ADR 0026, ADR 0033.
; ─────────────────────────────────────────────────────────────────────────────


; The missile is the game. Speed against turn rate IS the handling model, and the
; fuse is the range limit that makes every shot a wager (ADR 0002).
[missile]

;; How fast the missile travels, and it never changes in flight — there is no
;; acceleration model. Speed multiplied by fuse_seconds is total reach, so raising
;; this raises range as well as difficulty.
base_speed = 58.0                  ; [20..400] m/s. Faster is strictly better and harder to fly
;; The missile's weight. Input moves the reticle instantly; this is how fast the
;; nose swings to catch up with it. Low feels heavy and punishes a bad launch angle;
;; high makes the reticle pointless because the nose is always already on it.
;; Watch the "aim off" row in the HUD while tuning — that gap is what this controls.
turn_rate_deg_per_sec = 41.85      ; [20..400] deg/s the missile turns toward the reticle. THIS is the weight
;; The missile detonates itself after this long, hit or not. Range limit and
;; difficulty dial in one: base_speed x fuse_seconds is how far a missile can reach,
;; so compare it against ship/standoff_distance. Firing near the limit demands a
;; near-perfect turn; firing close is nearly free but concedes a volley.
fuse_seconds = 6.0                 ; [1..20] flight time before it detonates itself = effective range
;; How much of the launching ship's own motion the missile keeps. 0 means it ignores
;; the ship and flies straight down the barrel (arcade). 1 means it carries the
;; ship's full sideways drift, so a fast-arcing ship throws the shot off-line at
;; launch. Undecided which feels better — that is why it is a dial.
velocity_inheritance = 0.0         ; [0..1] 0 = arcade, 1 = full ship velocity carried into launch
;; How far off the nose the reticle can be pushed. It exists so the reticle can
;; never be parked somewhere the missile has no hope of reaching — a control that
;; lies. It also caps worst-case lag: at 42 deg and 100 deg/s the nose is at most
;; 0.42 s behind the reticle.
reticle_max_angle_deg = 43.675     ; [5..90] how far off the nose the reticle can be parked

;; Boost: hold the button for a burst of speed, drawn from a reserve that does not
;; refill in flight. Boost is the satisfaction verb (ADR 0003), and it is the only
;; thing that ever changes the missile's speed — which makes it the one value that
;; can break the speed hierarchy in CLAUDE.md. Keep base_speed x boost_multiplier
;; below whatever a laser ends up doing.
boost_multiplier = 1.9             ; [1..4] multiplies base_speed while the button is held
boost_seconds = 1.8                ; [0..10] s of boost in the reserve, per missile
boost_regen_per_sec = 0.03         ; [0..3] reserve refill while off-boost. 0 = one tank per flight

;; Dodge: one press, one discrete sideways displacement, then a cooldown. Left and
;; right only — there is no vertical dodge and no held slide (ADR 0039 supersedes
;; the bounded-slide thrusters of ADR 0037). The slide eases out, so the first
;; frames carry most of the distance and it reads as a flick rather than a drift.
;; cooldown is what makes it a decision: below dodge_seconds it is effectively a
;; held strafe again, which is the thing this replaced.
dodge_distance = 22.0              ; [0..120] m sideways per dodge
dodge_seconds = 0.28               ; [0.05..1.5] s the displacement takes. Short reads as a flick
dodge_cooldown_seconds = 1.1       ; [0..6] s before another dodge. Keep it above dodge_seconds

;; Brake: hold to trade speed for agility. Slower means the fuse buys less distance
;; (ADR 0002), so braking already costs range and needs no reserve of its own. It
;; overrides boost while both are held — the recovery verb wins over the commit one.
brake_speed_multiplier = 0.55      ; [0.1..1] multiplies base_speed while held
brake_turn_multiplier = 1.8        ; [1..4] multiplies turn_rate_deg_per_sec while held

;; What a direct hit spends against a component's pool (enemy/component_hit_points).
;; At half the pool this is the two-hit behaviour ADR 0042 shipped with, now stated
;; as a number so the turret's four weapons can be priced against the same currency
;; (ADR 0049). Splash, which is steeply worse than a direct hit (ADR 0004), arrives
;; with the unguided missile.
damage = 50.0                      ; [1..500] damage a direct hit spends on a component

; Gray-box body. Only reason it exists is so the chase cam has something to sit behind.
body_length = 2.56                 ; [0.2..12] m
body_width = 0.4845                ; [0.05..4] m
body_color = "#c9ccd2"
exhaust_length = 2.4               ; [0..12] m, drawn behind the body
exhaust_color = "#5ea8ff"

;; Splash (ADR 0004), and the last of POC step 5. The warhead goes off wherever the
;; missile ends — early detonate, fuse expiry or impact — so a miss is a graded
;; outcome instead of a binary one. It is deliberately a CONSOLATION, never a
;; strategy: if detonating near the target were nearly as good as hitting it, the
;; skill game that fuse-as-range and steering exist to create would be deleted.
;;
;; The detonation flash is drawn at exactly this radius. One number, because a
;; blast that looks bigger than it reaches is a lie the player acts on — the same
;; rule the rocks and the hull are built on (ADR 0041, ADR 0043). Keep it under
;; camera/missile_follow_distance or the camera ends up inside the flash.
splash_radius = 8.67               ; [1..60] m the blast reaches. The flash is drawn at exactly this
;; Damage at the very centre of the blast, as a share of a direct hit. 0.25 is the
;; number ADR 0004 named. splash_max_fraction is the ceiling it is clamped to in
;; code, so no tuning session can quietly make splash worth as much as aiming.
splash_damage_fraction = 0.25      ; [0..0.9] share of `damage` delivered at the blast centre
splash_max_fraction = 0.4          ; [0..0.9] hard ceiling on the above, enforced in code
;; How fast damage collapses with distance. 2 is quadratic; higher makes the edge
;; of the radius worth almost nothing. Floored at 2 in code — a straight taper is
;; the polite version ADR 0004 rejects.
splash_falloff_power = 2.4         ; [2..8] steeper = the blast only really counts near its centre

; Detonation marker. The end radius is splash_radius, above.
flash_start_radius = 1.5           ; [0.1..20] m
flash_seconds = 0.45               ; [0.05..3] how long it expands and fades
flash_color = "#ffd9a0"            ; on a hit
flash_color_dud = "#6b7d92"        ; on a fuse expiry


; The mothership under its one autopilot behaviour: a slow arc at standoff with
; the nose held on the target. Not a flight model, not an AI (ADR 0013).
[ship]

;; How fast the ship slides around its target. This is where launch-geometry variety
;; comes from: the faster it arcs, the more sideways the missile is travelling at
;; launch, and the bigger the turn you have to fly.
arc_speed = 13.8                   ; [0..80] m/s along the arc. Drives how much launch geometry varies
;; The range the autopilot tries to hold. Compare against missile reach
;; (base_speed x fuse_seconds): set this beyond reach and every shot expires short no
;; matter how well you fly. Editing this snaps the ship immediately.
standoff_distance = 203.0          ; [50..900] m the autopilot holds. Compare against missile reach!
;; Roughly how long the autopilot takes to correct a range error. Lower is stiffer
;; and holds standoff tighter against the target's drift; higher lets range wander.
;; Steady-state error is about enemy/drift_speed x this value.
range_hold_seconds = 2.4785        ; [0.2..10] how quickly it corrects a range error. Lower = stiffer
;; Ceiling on the closing or backing-off speed the range correction may use. Without
;; it, a large standoff edit reads as the ship charging its target.
range_hold_max_speed = 45.0        ; [1..200] m/s cap on that correction, so it never reads as a charge
;; How fast the autopilot swings the nose onto its direction of travel. It used to
;; snap, which is invisible while the autopilot has been flying all along — but the
;; frame the player hands the ship back, the nose is wherever THEY left it, and an
;; instant re-point reads as the ship being yanked away. Low enough to see, high
;; enough not to fly sideways for seconds.
autopilot_turn_rate_deg_per_sec = 34.0 ; [3..180] deg/s the autopilot re-points the nose
;; How far ahead of the ship's origin a missile appears, so it does not spawn inside
;; the hull mesh.
;; A 48 m hull, so this has to clear the bow at 24 m or missiles spawn inside the
;; ship and detonate on the first frame.
muzzle_offset = 30.0               ; [0..80] m ahead of the ship that a missile appears
;; The launch tube's reload, and the metronome of the entire loop (POC step 6). It
;; is what makes success criterion 2 — "still choosing to fire, and never feels
;; stuck waiting" — a question with an answer: without it there is no
;; between-missiles for the turret to be the answer to.
;;
;; The clock starts at LAUNCH, not at detonation, so a second spent in the missile
;; is a second off the gun. Ending a ride early buys turret time; riding the fuse
;; out spends it. Compare against missile/fuse_seconds: below it, the tube is always
;; ready by the time you land, and the cooldown does nothing.
;; 0 removes the cooldown entirely, which is the pre-step-6 arena.
missile_cooldown_seconds = 10.0    ; [0..60] s between launches, timed from the LAUNCH

;; Manual flight (ADR 0040). T hands the ship between the autopilot and the player.
;; This is the ship's throttle, not the missile's boost: W and S move a lever that
;; STAYS where it is put, so the ship holds its speed when both keys are released.
;; The seconds below are the full travel of that lever end to end.
autopilot_on_start = true          ; false starts every run under manual control
manual_accel_seconds = 3.2         ; [0.1..15] s from a standing start to full throttle
manual_brake_seconds = 2.4         ; [0.1..15] s from full throttle back to a stop
;; Top speed the ship may reach. It is silently clamped to
;; missile/base_speed x manual_speed_ceiling_fraction, because a ship that keeps up
;; with a missile makes the missile pointless — the speed hierarchy in CLAUDE.md is
;; enforced in code, so raising this past the clamp does nothing.
manual_max_speed = 34.0            ; [1..300] m/s at full throttle, before the clamp below
manual_speed_ceiling_fraction = 0.6 ; [0.05..0.95] share of missile speed the ship may reach. THE hierarchy
;; The ship's weight, the same instrument the missile flies with and deliberately a
;; much heavier setting. Compare against missile/turn_rate_deg_per_sec: the gap
;; between them is how different the two vehicles feel to fly.
manual_turn_rate_deg_per_sec = 26.0 ; [3..180] deg/s the ship swings towards the reticle
manual_reticle_max_angle_deg = 55.0 ; [5..90] how far off the nose the ship's reticle can be pushed
;; Lateral thrusters, held rather than a one-press dodge. A ship is not flying a
;; terminal approach, so ADR 0039's objection to a held slide does not apply to it.
manual_strafe_speed = 12.0         ; [0..80] m/s sideways while A or D is held
;; The carrier mesh is authored at 1 unit = 1 metre and 48 m long, so 1.0 is
;; life-size and this is a dial for trying the ship bigger or smaller against a
;; 203 m standoff, not a units fudge (ADR 0044).
hull_scale = 1.0                   ; [0.2..12] 1.0 = the 48 m the mesh was drawn at
;; Hit points, and whether they mean anything. INVULNERABLE IS TRUE FOR THIS BUILD,
;; at the human's direction: the pacing test asks "does being pulled to the turret
;; disrupt the rhythm?", and that is answerable without a consequence for failing.
;; Damage now would mix a pacing signal with a difficulty one and neither could be
;; read cleanly. Hits still register — they are counted and they flash — because
;; otherwise a failed intercept looks the same as one that never arrived.
;; Turning damage on is a flip of this one flag, not a build.
invulnerable = true                ; true = hits are counted and shown, but cost nothing
hp = 100.0                         ; [1..2000] the pool, once invulnerable is false
;; The sphere an incoming missile is tested against, as a multiple of the hull
;; mesh's own bounds. Derived rather than typed, for the reason the target's bound
;; is: a number a few metres short makes part of the ship silently unhittable and
;; there is no error anywhere to find. THIS IS THE LAST SPHERE-AROUND-A-MESH IN THE
;; GAME — exactly the shape ADR 0043 was written about. It is only acceptable while
;; the player cannot be hurt; when damage arrives it has to become the hull's own
;; volumes, the way the target's did.
hit_radius_scale = 1.0             ; [0.2..3] x the hull mesh's own half-diagonal
hull_tint = "#8f9aa6"
metallic = 0.12                    ; [0..1] keep low: an empty environment gives metal nothing to reflect
roughness = 0.555                  ; [0..1]


; The gun station (POC step 6): what the player does between missiles. `G` mans it
; exactly as `T` takes the helm, and the two are peers — you are at one station or
; the other, never both. Only the station itself exists so far; the four weapons
; are the next stage of docs/TURRET_MODE_IMPLEMENTATION.md and their values will
; land in this section beside these.
[turret]

;; Where the station sits, in the SHIP's own frame: +Y up, -Z forward. The mount
;; rides the hull and swings as the ship turns, while the aim stays where it was
;; left — that is what makes it a turret and not a nose gun. The carrier mesh
;; reaches about 16 m above its spine and 29 m fore and aft, so keep Y clear of
;; that or the camera starts the frame inside the hull.
mount_offset = Vector3(0.0, 18.0, -6.0) ; m from the ship's origin, in the ship's own axes
;; How far ahead of the station a round appears, so nothing spawns inside the mount.
muzzle_offset = 8.0                ; [0..60] m ahead of the station that a round appears
;; And how far OFF the sight line, in the station's own frame: -Y is below it.
;; This is not decoration. Fired from the sight line itself, every tracer and every
;; beam travels straight down the camera's view axis and projects to a single dot
;; at the crosshair — the player cannot see their own fire at all. Dropping the
;; muzzle below the sight puts the tracers in frame, rising towards the crosshair.
;; Zero it to see the problem.
muzzle_mount_offset = Vector3(0.0, -3.5, 0.0) ; m off the sight line. -Y puts the guns below it
;; The range the guns are SIGHTED at. Because the muzzle is off the sight line,
;; shots are aimed at the point the crosshair marks rather than fired parallel to
;; the aim — so they are exactly right at this range and progressively off either
;; side of it, the way a real sighted gun is. The crosshair is drawn here too, so
;; there is one number rather than two that have to agree.
;; Set it near ship/standoff_distance: that is the range the fight is held at.
convergence_distance = 210.0       ; [20..2000] m at which the crosshair and the shot agree
;; Degrees per second the gun sweeps at full stick deflection. The MOUSE does not
;; use this: it aims 1:1 at controls/turret_mouse_sensitivity, with no reticle and
;; no lag. Two of the four weapons are near-instant and one is hitscan, and an aim
;; that lags behind a hitscan shot is a control that lies about where the shot went.
traverse_deg_per_sec = 90.0        ; [10..400] deg/s the STICK sweeps the gun. The mouse is 1:1
;; How far above and below the shared horizon (ADR 0045) the gun can point. Every
;; ship is on one plane, so a turret that elevates a long way is aiming at empty
;; space; the limit is mostly so the camera boom has somewhere sane to sit.
elevation_limit_deg = 55.0         ; [5..89] deg up and down from the horizon

;; Four weapons, two loadouts, two buttons: `1` and `2` switch, left and right
;; click fire. Reaching the other two costs a loadout switch — that is the
;; mechanic, not a UI convenience. Names rather than numbers, so a typo fails
;; loudly to nothing instead of quietly landing on whichever weapon shares an index.
;; Valid: "autocannon", "unguided", "pulse", "blocker", "none".
;; "none" is how a weapon is taken out of a test run without a code change.
loadout_1_primary = "autocannon"   ; left click, loadout 1
loadout_1_secondary = "pulse"      ; right click, loadout 1
loadout_2_primary = "unguided"     ; left click, loadout 2
loadout_2_secondary = "blocker"    ; right click, loadout 2

;; The speed hierarchy in CLAUDE.md is structural: lasers > missiles > ships. A
;; turret round is not a laser, but it must still ARRIVE faster than the thing the
;; player rides, or the missile stops being the fastest way to reach the target and
;; the shape of the whole engagement inverts. This is a FLOOR under every
;; projectile's speed, measured against the missile's BOOSTED top speed
;; (base_speed x boost_multiplier) — a boosting missile is still a missile. Setting
;; a round slower than this in its own key does nothing.
projectile_speed_floor_fraction = 1.15 ; [1..4] x boosted missile speed. The hierarchy, in code

;; Autocannon: the always-available weapon. Unlimited ammo by specification, so the
;; only thing rationing it is the fire rate. Medium range — comfortably past
;; ship/standoff_distance, so it is the weapon that works from where the autopilot
;; parks you.
autocannon_rounds_per_second = 2.0 ; [0.2..20] shots per second while held
autocannon_damage = 9.0            ; [0.5..200] per round, against enemy/component_hit_points
autocannon_speed = 320.0           ; [50..2000] m/s. Clamped UP by the floor above, never down
autocannon_range = 420.0           ; [20..3000] m before a round expires
autocannon_round_length = 5.0      ; [0.2..40] m of tracer, so the round is legible at speed
autocannon_round_width = 0.35      ; [0.05..3] m
autocannon_round_color = "#ffe08a"
;; No warhead: a solid round. Every projectile reads a blast radius from its own
;; group, and zero is how it says "I am a bullet". Raise it and the autocannon
;; starts firing grenades, which is a different weapon and not this one.
autocannon_blast_radius = 0.0      ; [0..40] m. 0 = a solid round, which is what this is

;; Pulse beam: hitscan, on purpose. The specification calls that a requirement, not
;; an optimisation — lead and travel time never have to be factored in, which is
;; also why the aim has no reticle (ADR 0048). It is rationed by HEAT rather than
;; ammo: hold it and the bar fills, and at full it locks out until it has cooled.
;; Damage is per SECOND, so a component darkens continuously under the beam instead
;; of in steps.
;;
;; The range is deliberately UNDER ship/standoff_distance: the beam is a reason to
;; close, and it is the one weapon that asks something of the manual flight the
;; player now has. Raising it above standoff removes that decision.
pulse_range = 180.0                ; [20..1200] m. Under ship/standoff_distance ON PURPOSE
;; The beam is resolved along the SIGHT LINE, not from the offset muzzle, so unlike
;; a travelling round it is exact at every range rather than only at
;; convergence_distance. That is the specification's "hitscan so lead and travel
;; time never have to be factored in", honoured all the way down. It is still drawn
;; from the muzzle, which is what a converging tracer looks like.
pulse_damage_per_second = 45.0     ; [1..600] damage per second held on a component
pulse_heat_per_second = 0.42       ; [0.05..4] share of the heat bar filled per second held
pulse_cool_per_second = 0.3        ; [0.02..4] share drained per second while not firing
pulse_overheat_lockout_seconds = 2.5 ; [0..15] s locked out after the bar fills
pulse_beam_width = 0.5             ; [0.05..6] m across, drawn
pulse_beam_color = "#a8f0ff"
pulse_beam_fade_seconds = 0.09     ; [0.01..1] how fast the tracer fades once firing stops

;; Where a turret round landed, borrowing the missile's own flash at a smaller
;; scale (ADR 0030 — a real impact effect is art, and this is gray-box). Two
;; colours, so a round that found a component reads differently from one that hit
;; the hull or a rock. Without that, aiming at components is unrewarded.
impact_flash_start_radius = 0.5    ; [0.05..10] m
impact_flash_end_radius = 3.2      ; [0.2..30] m
impact_flash_seconds = 0.22        ; [0.03..2]
impact_flash_color = "#ffd9a0"     ; on a component
impact_flash_color_dud = "#7d8794" ; on the hull or a rock

;; Unguided missile: click to fire, click AGAIN to set it off wherever it has got
;; to. One in the air at a time, deliberately — the second click is the whole
;; mechanic, and with a dozen in flight the button would mean nothing in
;; particular. It is the answer to two problems the other weapons cannot solve:
;; several components at once, and (once they exist) an incoming enemy missile.
;;
;; The blast radius is twice missile/splash_radius, as specified. It is a tuned
;; number rather than a derived one so the two can drift apart deliberately.
unguided_magazine = 10             ; [0..60] rounds before the magazine is dry
;; Seconds for ONE round to trickle back, not for the whole magazine. 0 means it
;; never refills in a session, which is the setting for reading what ten shots is
;; actually worth.
unguided_reload_seconds = 6.0      ; [0..120] s per round returned. 0 = never refills
unguided_damage = 40.0             ; [0.5..400] on a DIRECT hit, before the blast
unguided_speed = 150.0             ; [50..2000] m/s. Slower than the cannon; still clamped up
unguided_range = 500.0             ; [20..3000] m before it goes off on its own
unguided_round_length = 3.2        ; [0.2..40] m
unguided_round_width = 0.6         ; [0.05..3] m
unguided_round_color = "#ff9a52"
;; The blast. Damage at the centre is capped in code against the direct hit above
;; (ADR 0004) — splash is a consolation, never a build — and falls off steeply from
;; there, so "somewhere near two components" is worth much less than "between them".
unguided_blast_radius = 17.34      ; [1..80] m. Twice missile/splash_radius, as specified
unguided_blast_damage = 22.0       ; [0.5..400] at the very centre, before the cap below
unguided_blast_max_fraction = 0.6  ; [0..0.9] hard ceiling as a share of unguided_damage
unguided_blast_falloff_power = 2.4 ; [2..8] steeper = only really counts near the centre
;; The blast is drawn at exactly unguided_blast_radius; this is only how long for.
unguided_flash_seconds = 0.5       ; [0.05..3] how long the blast expands and fades
unguided_flash_color = "#ffb066"

;; Blockers: a star of flares thrown along the aim, on a cooldown rather than a
;; magazine. A countermeasure you can run out of permanently is a trap; one you can
;; spam is not a decision. Aim it at what is COMING, not at what you are shooting —
;; the ring is thrown perpendicular to the direction it is given, so it is a wall
;; across that axis rather than a cone down it.
blocker_cooldown_seconds = 5.0     ; [0..30] s between stars. The spec's number
blocker_flare_count = 6            ; [1..24] flares per star. Each stops one missile and dies

; One dumb target. Drifts, turns at its patrol bounds, and nothing else — return
; fire and blockers are POC steps 7 and 8.
[enemy]

;; No longer the target's kill sphere — the hull is hit as the boxes it is drawn
;; from now (ADR 0043), so what you see is what you hit, the same rule the rocks
;; got. This is the HUD's range reference and the fallback hit radius for a plain
;; target with no parts (which is what the headless flight test uses).
;;
;; Consequence worth knowing before a tuning session: hits are meaningfully harder
;; than they were. The old 9 m sphere was far more forgiving than the 12 m hull it
;; wrapped. If the target now feels unfairly small, grow it with the hull_* values
;; below rather than by re-inflating a sphere around it.
radius = 9.0                       ; [1..60] m. HUD range reference; no longer the kill shape
;; How fast the target wanders. Non-zero drift is what makes the autopilot's
;; range-holding matter, and what stops every launch geometry being identical.
drift_speed = 20.0                 ; [0..60] m/s
spin_deg_per_sec = 6.3             ; [0..180] cosmetic, makes it read as an object not a decal
patrol_half_extent = 300.0         ; [0..800] m from arena centre before it turns around
hull_color = "#c2603f"
hull_emission = 0.89               ; [0..4] high on purpose: it has to be findable at standoff range

;; The hull's shape, in metres. It is built from primitives every reload (ADR 0030),
;; so these are the ship's actual proportions and not a scale factor. A silhouette
;; with a nose and a tail is the point: a cube gives the eye nothing to aim at, so
;; there is no way to tell a shot that was aimed from one that merely arrived.
;; None of this is the hit sphere — that is `radius`, above.
hull_length = 12.0                 ; [2..120] m nose to tail. Keep length/2 + nose under `radius`
hull_width = 5.5                   ; [1..60] m across the fuselage
hull_height = 3.2                  ; [1..40] m top to bottom
nose_length = 5.0                  ; [0..60] m of cone ahead of the fuselage
wing_span = 16.0                   ; [0..160] m tip to tip. Half of this should stay under `radius`
wing_chord = 5.0                   ; [0..60] m front to back
wing_thickness = 0.7               ; [0.1..8] m
fin_height = 3.6                   ; [0..40] m of tail fin above the hull

;; Components (ADR 0042): small cylinders bolted around the hull, each its own hit
;; sphere, tested BEFORE the hull's — so a shot that could count either way is
;; credited to the part that was aimed at. First hit darkens, second destroys.
;; This is the target-practice experiment. Set component_count = 0 to get the
;; single-hit-sphere target back and feel the two side by side.
component_count = 4                ; [0..12] cylinders ringed around the hull
;; The size of one component's damage pool, and the currency every weapon is priced
;; in (ADR 0049). It replaced a count of hits when the turret arrived — an
;; autocannon round, a beam's per-second tick and a missile warhead are not
;; interchangeable and a counter cannot tell them apart. At 100 against
;; missile/damage of 50 this is exactly the two-missile-hit behaviour it replaced.
component_hit_points = 100.0       ; [1..2000] damage a component absorbs before it goes up
;; Mount radius has to put the cylinder PROUD of the fuselage, not flush with it.
;; A component buried in the hull is unaimable no matter how the hit tests are
;; ordered — that was the shipped bug (ADR 0043) and the headless gate now fails on
;; it. Compare against hull_width and hull_height above.
component_radius = 1.5             ; [0.2..12] m of the cylinder
component_length = 3.6             ; [0.5..30] m of the cylinder
component_mount_radius = 3.4       ; [0..40] m out from the hull's spine. Must clear the fuselage
;; The component's hit sphere. A little bigger than the cylinder it wraps, on
;; purpose: these are what the player is aiming at, and a hit box tighter than the
;; art turns aiming into a coin toss. It does not need to be small relative to the
;; hull any more — the hull is hit as its own boxes now, and whichever shape the
;; shot reaches first is the one that scores.
component_hit_radius = 2.0         ; [0.2..20] m. Close to the drawn cylinder, slightly generous
component_damaged_darken = 0.45    ; [0..1] how much darker a damaged component goes
;; How long a destroyed component takes to come back. Without this a practice run
;; is over after a few hits and the loop cannot be felt twice in one session.
;; 0 leaves the target stripped until the tuning file is reloaded.
component_respawn_seconds = 8.0    ; [0..120] s before a destroyed component returns. 0 = never
;; Countermeasures (ADR 0051). When a player missile comes inside trigger_range the
;; ship rolls ONCE for that missile and, if it wins and its launcher is cool, throws
;; a star of flares at it. Once per missile, not once per frame — a per-frame roll
;; of 0.5 fires on the first frame every time and the chance would mean nothing.
;;
;; Set blocker_chance to 0 to take this layer out of a test run entirely; that is
;; the "every layer independently disableable" requirement of this build.
blocker_chance = 0.5               ; [0..1] chance of answering a given missile. 0 = never
;; The whole difficulty of the mechanic is WHEN the wall goes up. Thrown early the
;; flares have dispersed by the time the missile arrives; thrown late there is no
;; room to fly around them. Compare against missile reach and ship/standoff_distance.
blocker_trigger_range = 120.0      ; [10..900] m at which an incoming missile is answered
blocker_cooldown_seconds = 6.0     ; [0..60] s before it can answer again
blocker_flare_count = 6            ; [1..24] flares per star

;; THE INTERRUPT (POC step 8). One guided missile at the player, on a timer.
;;
;; Read docs/COMBAT_POC_IMPLEMENTATION.md before touching this. It is emphatic:
;; this parameter is "the single easiest way to turn a relaxed game into a
;; stressful one", and "expect the good value to be much larger than intuition
;; suggests". It ships at the specified 60 s EXPECTING TO BE RAISED. With a 10 s
;; tube and a ~6 s ride, once a minute is an interrupt on roughly every sixth
;; action — probably right for a TEST, since an interrupt you never see cannot be
;; evaluated, and far denser than the design predicts will survive.
;;
;; 0 switches the whole layer off, which is how a clean reading of the steps before
;; it is still obtainable.
interrupt_interval_seconds = 60.0  ; [0..600] s between interrupts. 0 = never. EXPECT TO RAISE
;; How far in advance the launch is announced. It is telegraphed BEFORE it happens,
;; not as it happens: an interrupt you can miss is not a spike, it is ambient dread,
;; and that is the exact failure the target-experience guard exists to prevent.
;; Pillar 2 also requires that it be possible to WIN BOTH — detonate on target and
;; make the turret in time — so this has to exceed a typical remaining ride. Compare
;; against missile/fuse_seconds.
interrupt_warning_lead_seconds = 8.0 ; [0..60] s of telegraph. Must beat a typical ride
;; The missile itself. It flies at a point NEAR the ship rather than at it: the aim
;; error is sampled once at launch and never corrected, so the miss is decided at
;; launch and is the same miss all the way in — something the player can read off
;; its line rather than a die roll at the end.
missile_aim_error = 26.0           ; [0..200] m of random offset. 0 = never misses
missile_speed = 62.0               ; [10..400] m/s. Clamped DOWN to the player's boosted top speed
missile_turn_rate_deg_per_sec = 22.0 ; [1..180] deg/s. Low enough that its line is readable
missile_fuse_seconds = 22.0        ; [1..120] s before it gives up
missile_radius = 2.6               ; [0.3..20] m. Drawn AND hit at this, like everything else
;; What it takes to shoot down. Compare against turret/autocannon_damage (a few
;; rounds) and turret/pulse_damage_per_second (a fraction of a second). If it is
;; unkillable by the autocannon the interrupt stops being answerable from loadout 1.
missile_hit_points = 20.0          ; [1..400] damage to destroy it
missile_damage = 25.0              ; [0..500] to the ship, if ship/invulnerable is false
missile_color = "#ff7a5c"

component_color = "#4fd6a0"
component_emission = 1.4           ; [0..4] they have to read as targets at standoff range


[camera]

fov_base = 70.0                    ; [40..120] degrees
;; How long the camera stays on the detonation before cutting back to the ship. Long
;; enough to read the outcome, short enough not to feel like a cutscene.
return_delay_sec = 0.7             ; [0..4] how long the detonation is watched before cutting back
missile_view_mode = "cut"          ; "cut" is the only mode implemented; PiP is POC step 9

; Ship view. Distance and height are relative to the ship's own axes.
; These grew with the hull: at 48 m stem to stern, the old 26 m put the camera
; inside the ship. Keep follow_distance well clear of ship/hull_scale x 24.
ship_follow_distance = 62.0        ; [3..400] m behind
ship_follow_height = 16.0          ; [-40..120] m above
ship_follow_lag = 6.0              ; [0.5..40] higher = snappier, lower = floatier
ship_look_ahead = 55.0             ; [0..300] m ahead of the ship that the camera aims at

; Missile view. This is the feel-critical one — the 8 seconds happen here.
missile_follow_distance = 7.85     ; [2..80] m behind
missile_follow_height = 2.0        ; [-20..30] m above. Puts the missile low in frame, target above it
;; How hard the missile camera is pinned to the missile. High glues it on and reads
;; as precise; low lets it swing behind on a turn, which reads as speed but costs
;; aiming accuracy. Probably the most feel-critical camera value in the game.
missile_follow_lag = 14.0          ; [0.5..40] snappier than the ship cam; lag reads as sloppy at speed
;; How far in front of the missile the camera aims. Larger pushes the missile lower
;; in frame and shows more of the approach; smaller centres the missile and shows
;; more of what is immediately around it.
missile_look_ahead = 25.5          ; [0..200] m ahead. Lower = missile more centred, less of the approach

; Turret view. The gun camera, and the one boom in the game that has to bend.
turret_follow_distance = 26.0      ; [3..200] m behind the station
turret_follow_height = 7.0         ; [-40..80] m above it
turret_follow_lag = 22.0           ; [0.5..40] high on purpose: a gun camera that lags lies too
turret_look_ahead = 90.0           ; [0..400] m up the aim that the camera aims at
;; How much of the gun's elevation the camera boom follows. 1 pins the boom to the
;; gun — which at high elevation swings it down and back THROUGH the hull the gun
;; is mounted on, and the shot ends up aimed from inside the ship. 0 keeps the boom
;; level with the horizon and lets the gun rise inside the frame, which is what a
;; turret looks like anyway. The camera still LOOKS along the true aim either way.
turret_boom_pitch_share = 0.3      ; [0..1] 0 = level boom, 1 = boom rigid on the gun

; Debug fly-cam, sandbox scene only. Not the game's camera.
free_move_speed = 13.4375          ; [1..200] m/s
free_boost_multiplier = 4.0        ; [1..20] while Shift is held
free_look_sensitivity = 0.1792     ; [0.01..2] degrees per pixel
free_move_smoothing = 11.92        ; [1..40]
start_position = Vector3(8.0, 3.2, -9.5)
start_look_at = Vector3(0.0, 0.0, 0.0)


; Both devices are capped by missile/turn_rate_deg_per_sec, so neither can ask for
; a turn the other cannot.
[controls]

;; Degrees the reticle sweeps per pixel of mouse movement. This moves the RETICLE,
;; not the missile — the missile's own response is missile/turn_rate_deg_per_sec.
mouse_sensitivity = 0.20           ; [0.01..2] degrees of RETICLE movement per pixel of mouse
;; Degrees per second the reticle sweeps at full stick deflection. The gamepad
;; equivalent of mouse_sensitivity; set it near turn_rate_deg_per_sec so a stick and
;; a mouse can ask for roughly the same thing.
stick_reticle_speed_deg_per_sec = 110.0 ; [10..500] deg/s the stick sweeps the reticle
;; Stick movement below this fraction is ignored. Input past it is rescaled from
;; zero, so the first live input is a nudge rather than a jump.
deadzone = 0.1485                  ; [0..0.6] rescaled past the edge, so first input is not a step
;; The same thing for the gun station, kept separate because aiming a turret and
;; flying a ship are different hand movements and want different numbers. This one
;; is 1:1 — it moves the GUN, not a reticle the gun then chases.
turret_mouse_sensitivity = 0.16    ; [0.01..2] degrees the GUN moves per pixel of mouse


[arena]

; Marker lattice: near-field speed reference. Count is per axis, so 7 means 7³.
marker_spacing = 90.0              ; [5..400] m between markers
marker_count_per_axis = 7          ; [1..15] 7³ = 343 markers, one draw call
marker_size = 2.2                  ; [0.1..20] m
marker_color = "#3f6c84"

background_color = "#05070c"
ambient_energy = 0.5               ; [0..4]
glow_enabled = true                ; bloom. The missile exhaust is what it mostly catches
glow_intensity = 0.4               ; [0..3]
key_light_energy = 2.2             ; [0..8]
key_light_angles_deg = Vector3(-30.0, 145.0, 0.0) ; pitch, yaw, roll
fill_light_energy = 0.55           ; [0..8]
fill_light_angles_deg = Vector3(14.0, -35.0, 0.0)

; Reference rocks, and now obstacles too: a missile that touches one dies (ADR 0038).
; Hits are swept-segment sphere tests, never physics bodies — ADR 0032's mechanism
; rule still stands; 0038 supersedes only its "keep them outside the fight" placement
; rule. inner_radius is now deliberately INSIDE the engagement volume. Raise it back
; above ship/standoff_distance to get the old reference-only arena back.
rock_count = 260                   ; [0..600]
rock_inner_radius = 69.8           ; [10..3000] m from arena centre. Inside the fight, on purpose
rock_outer_radius = 1567.4         ; [10..6000] m
rock_slab_half_height = 220.0      ; [0..1500] m above and below the plane
rock_min_size = 8.0                ; [0.5..120] m
rock_max_size = 46.0               ; [0.5..200] m
rock_color = "#6d675c"
rock_seed = 20260823               ; fixed, so the arena is identical between runs
rock_collision = true              ; missiles die on contact. false = scenery only, the pre-ADR-0038 arena

;; Rock shape (ADR 0041). Each rock is a cluster of overlapping ellipsoids: one
;; main lobe on the rock's origin, the rest hung off it at an offset shorter than
;; the main radius, which is what keeps each one less than half exposed. The lobes
;; are BOTH what is drawn and what is hit — there is no separate hit shape to drift
;; out of agreement with the art, which is what the single box used to do at its
;; corners.
rock_lobe_min = 3                  ; [1..10] fewest lobes in a rock
rock_lobe_max = 6                  ; [1..12] most lobes in a rock
rock_lobe_size_min = 0.35          ; [0.05..1] smallest satellite lobe, as a share of the main one
rock_lobe_size_max = 0.7           ; [0.05..1] largest satellite lobe. Above 1 and the "main" lobe is not
rock_lobe_offset_min = 0.45        ; [0..1.5] closest a lobe sits to the centre, in main radii
rock_lobe_offset_max = 0.95        ; [0..1.5] furthest. Above 1 exposes more than half the lobe
;; Per-axis stretch on every lobe. 0 gives perfect spheres, which read as a pile of
;; balls; the jitter is what makes the cluster look quarried.
rock_elongation = 0.45             ; [0..0.9] how far from spherical each lobe is
;; Hit size against drawn size. 1.0 means the rock is exactly as solid as it looks,
;; which is the point of the cluster — it was 0.55 when rocks were boxes and the
;; corners had to be forgiven. Under 1 lets a missile clip a silhouette and live.
rock_hit_radius_scale = 1.0        ; [0.1..1.5] hit shape vs drawn shape. 1.0 = what you see is what you hit


; Countermeasure flares, shared by both sides — the turret's blockers and the
; target's answer to an incoming missile. A missile that touches a flare of the
; OTHER side dies. No seduction, no decoy tracking, no chance of being fooled: a
; flare is a physical object in the way, so the counter to it is flying around it,
; and that is something the player can see and learn rather than a die roll
; happening off screen (ADR 0051).
[flare]

;; Drawn AND hit at this radius — one number. A countermeasure that looks bigger
;; than it is would be the worst place in the game for that lie, because the player
;; is threading a missile between them at speed (ADR 0041, 0043, 0050).
radius = 5.5                       ; [0.5..30] m. Both the drawn sphere and the kill sphere
;; Slow on purpose: a flare is a wall thrown up for a moment, not a projectile.
;; Faster spreads the star wider before the missile arrives, which makes an early
;; throw better; slower keeps it tight, which makes a late one better.
speed = 26.0                       ; [0..200] m/s outward
seconds = 4.0                      ; [0.2..20] s before it fades and stops blocking
;; How much the star leans towards the threat instead of spreading across it. 0 is a
;; flat ring perpendicular to the axis it was thrown along — a wall. 1 is a straight
;; line at the threat, which blocks nothing. Small values throw the wall out to meet
;; the missile rather than dropping it in place.
forward_bias = 0.25                ; [0..0.95] 0 = a flat wall, 1 = a useless straight line
player_color = "#9fe8ff"
enemy_color = "#ffb0b0"
;; The flash when a flare is spent stopping something. Without it a missile simply
;; stops existing and the player cannot tell an interception from a bug.
kill_flash_radius = 7.0            ; [0.5..40] m
kill_flash_seconds = 0.3           ; [0.05..2]
kill_flash_color = "#ffd9a0"


; Sandbox scene only — the asset-inspection harness, not the game.
[probe]

scale = 2.0                        ; [0.1..12]
spin_deg_per_sec = 18.45           ; [0..180]
bob_amplitude = 0.6                ; [0..20] m
bob_period_sec = 6.0               ; [0.2..40]
hull_tint = "#8f9aa6"
metallic = 0.12                    ; [0..1]
roughness = 0.5475                 ; [0..1]


; Screen-space instruments. The target indicator exists because the ship points
; along its own velocity now and not at the target; the reticle exists because
; the missile lags behind where you asked it to go.
[hud]

font_size = 14                     ; [8..40]
line_width = 2.0                   ; [0.5..8]

target_color = "#ff9a52"
target_bracket_size = 39.68        ; [8..200] px across, when the target is on screen
arrow_size = 18.25                 ; [4..80] px, the off-screen pointer
edge_margin = 34.0                 ; [0..200] px kept clear at the screen edge

reticle_color = "#7ce0ff"
reticle_size = 17.0                ; [3..80] px radius
reticle_distance = 60.0            ; [5..400] m ahead of the missile that the reticle is drawn
reticle_lag_line_alpha = 0.35      ; [0..1] the nose-to-reticle line. 0 hides it

;; The gun's crosshair. A different shape from the reticle above on purpose: the
;; reticle is a request the missile has not caught up with yet, while this is where
;; the shot goes, now. Two instruments meaning different things must not look alike.
turret_reticle_color = "#ffd36e"
turret_reticle_size = 15.0         ; [3..80] px across
;; The camera is behind the gun, not at the muzzle, so the crosshair is only
;; EXACTLY right for a target at the distance it is drawn at — everything nearer or
;; further sits a little off it. Set this near ship/standoff_distance, which is the
;; range the fight is actually held at.
;; The pulse beam's heat, drawn under the crosshair. It has to be readable without
;; looking away from the aim — a gauge on the far side of the screen is a gauge
;; nobody reads, and overheating then arrives as a surprise instead of as a
;; decision. It only appears when there is heat to show.
turret_heat_bar_width = 74.0       ; [10..400] px across at full
turret_heat_bar_height = 5.0       ; [1..30] px
turret_heat_bar_offset = 30.0      ; [0..200] px below the crosshair
turret_heat_color = "#7ce0ff"
turret_overheat_color = "#ff6a4d"  ; while locked out

;; The launch tube's reload, along the bottom of the screen in EVERY view. It is on
;; the flight overlay rather than in the debug HUD because it is the one gauge this
;; whole build exists to read: "am I ever stuck waiting?" is a question about this
;; bar, and it has to be answerable at a glance from the turret, from the helm and
;; from inside a missile, without F1.
tube_bar_width = 220.0             ; [40..900] px across
tube_bar_height = 6.0              ; [1..40] px
tube_bar_bottom_margin = 26.0      ; [0..300] px up from the bottom of the screen
tube_ready_color = "#8fffa8"       ; a missile is available
tube_reloading_color = "#ffb066"   ; still reloading

;; The interrupt's alert. The specification asked for "a small alert"; the scope
;; doc asks for one that is "loud, telegraphed, unambiguous". Those pull in opposite
;; directions, so it is built PROMINENT and these exist to tune it DOWN — an alert
;; small enough to miss stops being a punctual spike and becomes ambient dread.
;; Tune it down until it is only just unmissable, and no further.
alert_color = "#ff6a4d"
alert_font_size = 30               ; [10..90] px
alert_top_margin = 64.0            ; [0..400] px down from the top of the screen
alert_pulse_hz = 1.1               ; [0..6] pulses per second. 0 = a steady banner
;; A bracket drawn on the missile itself, so "incoming" is a DIRECTION and not just
;; a word. Without it the player has to sweep the whole sky to find the thing.
alert_bracket_size = 52.0          ; [8..300] px across
;; How long the telegraph banner stays up after the warning is raised. It is
;; replaced by the live "INCOMING MISSILE — N m" readout once one is in the air.
alert_seconds = 4.0                ; [0.5..30] s the pre-launch banner is shown

;; The impact tint round the edge of the screen. It fires whether or not the hit
;; cost anything: with ship/invulnerable on, a failed intercept still has to be
;; distinguishable from one that never arrived, or there is nothing to pace against.
hit_flash_seconds = 0.6            ; [0.05..4] how long the tint fades over
hit_flash_band = 26.0              ; [2..200] px of screen edge tinted
hit_flash_color = "#ff4a3a"
