; ─────────────────────────────────────────────────────────────────────────────
;  MISSILE RIDER — TUNING
;
;  Every gameplay-feel value in the game lives here and nowhere else. Save this
;  file and a running game picks it up immediately; no restart, no rebuild.
;
;  Comments start with ';' and may sit at the end of a value line. '#' is NOT a
;  comment character here — it gets parsed into the next key and breaks the file.
;
;  Types are Godot literals: 90.0 float, 100 int, "text" string, Vector3(x, y, z).
;  Colours are hex strings.
;
;  Nothing here is a decision. These are starting positions for a tuning session.
;  See CLAUDE.md (feel-parameter law), ADR 0026, ADR 0033.
; ─────────────────────────────────────────────────────────────────────────────


; The missile is the game. Speed against turn rate IS the handling model, and the
; fuse is the range limit that makes every shot a wager (ADR 0002).
[missile]

base_speed = 90.0                  ; m/s. Faster is strictly better and harder to fly
turn_rate_deg_per_sec = 100.0      ; deg/s the missile turns toward the reticle. THIS is the weight
fuse_seconds = 5.0                 ; flight time before it detonates itself = effective range
velocity_inheritance = 0.0         ; 0 = arcade, 1 = full ship velocity carried into launch
reticle_max_angle_deg = 42.0       ; how far off the nose the reticle can be parked

; Gray-box body. Only reason it exists is so the chase cam has something to sit behind.
body_length = 2.6                  ; m
body_width = 0.5                   ; m
body_color = "#c9ccd2"
exhaust_length = 2.4               ; m, drawn behind the body
exhaust_color = "#5ea8ff"

; Detonation marker. Keep end_radius under camera/missile_follow_distance or the
; camera ends up inside the flash and the screen washes out.
flash_start_radius = 1.5           ; m
flash_end_radius = 9.0             ; m
flash_seconds = 0.45               ; how long it expands and fades
flash_color = "#ffd9a0"            ; on a hit
flash_color_dud = "#6b7d92"        ; on a fuse expiry


; The mothership under its one autopilot behaviour: a slow arc at standoff with
; the nose held on the target. Not a flight model, not an AI (ADR 0013).
[ship]

arc_speed = 14.0                   ; m/s along the arc. Drives how much launch geometry varies
standoff_distance = 300.0          ; m the autopilot holds. Compare against missile reach!
range_hold_seconds = 2.5           ; how quickly it corrects a range error. Lower = stiffer
range_hold_max_speed = 45.0        ; m/s cap on that correction, so it never reads as a charge
muzzle_offset = 6.0                ; m ahead of the ship that a missile appears
hull_scale = 2.0
hull_tint = "#8f9aa6"
metallic = 0.12                    ; keep low: an empty environment gives metal nothing to reflect
roughness = 0.55


; One dumb target. Drifts, turns at its patrol bounds, and nothing else — return
; fire and blockers are POC steps 7 and 8.
[enemy]

radius = 9.0                       ; m. This is the hit sphere, not just the art size
drift_speed = 6.0                  ; m/s
spin_deg_per_sec = 6.0             ; cosmetic, makes it read as an object not a decal
patrol_half_extent = 120.0         ; m from arena centre before it turns around
hull_color = "#c2603f"
hull_emission = 0.9                ; high on purpose: it has to be findable at standoff range


[camera]

fov_base = 70.0                    ; degrees
return_delay_sec = 0.7             ; how long the detonation is watched before cutting back
missile_view_mode = "cut"          ; "cut" is the only mode implemented; PiP is POC step 9

; Ship view. Distance and height are relative to the ship's own axes.
ship_follow_distance = 26.0        ; m behind
ship_follow_height = 7.0           ; m above
ship_follow_lag = 6.0              ; higher = snappier, lower = floatier
ship_look_ahead = 30.0             ; m ahead of the ship that the camera aims at

; Missile view. This is the feel-critical one — the 8 seconds happen here.
missile_follow_distance = 14.0     ; m behind
missile_follow_height = 2.8        ; m above. Puts the missile low in frame, target above it
missile_follow_lag = 14.0          ; snappier than the ship cam; lag reads as sloppy at speed
missile_look_ahead = 26.0          ; m ahead. Lower = missile more centred, less of the approach

; Debug fly-cam, sandbox scene only. Not the game's camera.
free_move_speed = 14.0             ; m/s
free_boost_multiplier = 4.0        ; while Shift is held
free_look_sensitivity = 0.18       ; degrees per pixel
free_move_smoothing = 12.0
start_position = Vector3(8.0, 3.2, -9.5)
start_look_at = Vector3(0.0, 0.0, 0.0)


; Both devices are capped by missile/turn_rate_deg_per_sec, so neither can ask for
; a turn the other cannot.
[controls]

mouse_sensitivity = 0.20           ; degrees of RETICLE movement per pixel of mouse
stick_reticle_speed_deg_per_sec = 110.0   ; deg/s the stick sweeps the reticle
deadzone = 0.15                    ; rescaled past the edge, so first input is not a step


[arena]

; Marker lattice: near-field speed reference. Count is per axis, so 7 means 7³.
marker_spacing = 90.0              ; m between markers
marker_count_per_axis = 7          ; 7³ = 343 markers, one draw call
marker_size = 2.2                  ; m
marker_color = "#3f6c84"

background_color = "#05070c"
ambient_energy = 0.5
glow_enabled = true                ; bloom. The missile exhaust is what it mostly catches
glow_intensity = 0.4
key_light_energy = 2.2
key_light_angles_deg = Vector3(-30.0, 145.0, 0.0)    ; pitch, yaw, roll
fill_light_energy = 0.55
fill_light_angles_deg = Vector3(14.0, -35.0, 0.0)

; Reference rocks: far-field speed reference. inner_radius must stay OUTSIDE the
; engagement volume — rocks inside it read as cover and as obstacles a missile
; should hit, and they have no collision (ADR 0032).
rock_count = 120
rock_inner_radius = 420.0          ; m from arena centre
rock_outer_radius = 1600.0         ; m
rock_slab_half_height = 220.0      ; m above and below the plane
rock_min_size = 8.0                ; m
rock_max_size = 46.0               ; m
rock_color = "#6d675c"
rock_seed = 20260823               ; fixed, so the arena is identical between runs


; Sandbox scene only — the asset-inspection harness, not the game.
[probe]

scale = 2.0
spin_deg_per_sec = 18.0
bob_amplitude = 0.6                ; m
bob_period_sec = 6.0
hull_tint = "#8f9aa6"
metallic = 0.12
roughness = 0.55


; Screen-space instruments. The target indicator exists because the ship points
; along its own velocity now and not at the target; the reticle exists because
; the missile lags behind where you asked it to go.
[hud]

font_size = 14
line_width = 2.0

target_color = "#ff9a52"
target_bracket_size = 44.0         ; px across, when the target is on screen
arrow_size = 18.0                  ; px, the off-screen pointer
edge_margin = 34.0                 ; px kept clear at the screen edge

reticle_color = "#7ce0ff"
reticle_size = 17.0                ; px radius
reticle_distance = 60.0            ; m ahead of the missile that the reticle is drawn
reticle_lag_line_alpha = 0.35      ; the nose-to-reticle line. 0 hides it
