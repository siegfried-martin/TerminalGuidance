; ─────────────────────────────────────────────────────────────────────────────
;  MISSILE RIDER — TUNING
;
;  Every gameplay-feel value in the game lives here and nowhere else. Save this
;  file and a running game picks it up immediately; no restart, no rebuild.
;
;  Comments start with ';' and may sit at the end of a value line. '#' is NOT a
;  comment character here — it gets parsed into the next key and breaks the file.
;
;  Types are Godot literals: 90.0 float, 100 int, "text" string, Vector3(x, y, z).
;  Colours are hex strings.
;
;  Nothing here is a decision. These are starting positions for a tuning session.
;  See CLAUDE.md (feel-parameter law), ADR 0026, ADR 0033.
; ─────────────────────────────────────────────────────────────────────────────


; The missile is the game. Speed against turn rate IS the handling model, and the
; fuse is the range limit that makes every shot a wager (ADR 0002).
[missile]

;; How fast the missile travels, and it never changes in flight — there is no
;; acceleration model. Speed multiplied by fuse_seconds is total reach, so raising
;; this raises range as well as difficulty.
base_speed = 58.0                  ; [20..400] m/s. Faster is strictly better and harder to fly
;; The missile's weight. Input moves the reticle instantly; this is how fast the
;; nose swings to catch up with it. Low feels heavy and punishes a bad launch angle;
;; high makes the reticle pointless because the nose is always already on it.
;; Watch the "aim off" row in the HUD while tuning — that gap is what this controls.
turn_rate_deg_per_sec = 41.85      ; [20..400] deg/s the missile turns toward the reticle. THIS is the weight
;; The missile detonates itself after this long, hit or not. Range limit and
;; difficulty dial in one: base_speed x fuse_seconds is how far a missile can reach,
;; so compare it against ship/standoff_distance. Firing near the limit demands a
;; near-perfect turn; firing close is nearly free but concedes a volley.
fuse_seconds = 6.0                 ; [1..20] flight time before it detonates itself = effective range
;; How much of the launching ship's own motion the missile keeps. 0 means it ignores
;; the ship and flies straight down the barrel (arcade). 1 means it carries the
;; ship's full sideways drift, so a fast-arcing ship throws the shot off-line at
;; launch. Undecided which feels better — that is why it is a dial.
velocity_inheritance = 0.0         ; [0..1] 0 = arcade, 1 = full ship velocity carried into launch
;; How far off the nose the reticle can be pushed. It exists so the reticle can
;; never be parked somewhere the missile has no hope of reaching — a control that
;; lies. It also caps worst-case lag: at 42 deg and 100 deg/s the nose is at most
;; 0.42 s behind the reticle.
reticle_max_angle_deg = 43.675     ; [5..90] how far off the nose the reticle can be parked

;; Boost: hold the button for a burst of speed, drawn from a reserve that does not
;; refill in flight. Boost is the satisfaction verb (ADR 0003), and it is the only
;; thing that ever changes the missile's speed — which makes it the one value that
;; can break the speed hierarchy in CLAUDE.md. Keep base_speed x boost_multiplier
;; below whatever a laser ends up doing.
boost_multiplier = 1.9             ; [1..4] multiplies base_speed while the button is held
boost_seconds = 1.8                ; [0..10] s of boost in the reserve, per missile
boost_regen_per_sec = 0.03         ; [0..3] reserve refill while off-boost. 0 = one tank per flight

;; Dodge: one press, one discrete sideways displacement, then a cooldown. Left and
;; right only — there is no vertical dodge and no held slide (ADR 0039 supersedes
;; the bounded-slide thrusters of ADR 0037). The slide eases out, so the first
;; frames carry most of the distance and it reads as a flick rather than a drift.
;; cooldown is what makes it a decision: below dodge_seconds it is effectively a
;; held strafe again, which is the thing this replaced.
dodge_distance = 22.0              ; [0..120] m sideways per dodge
dodge_seconds = 0.28               ; [0.05..1.5] s the displacement takes. Short reads as a flick
dodge_cooldown_seconds = 1.1       ; [0..6] s before another dodge. Keep it above dodge_seconds

;; Brake: hold to trade speed for agility. Slower means the fuse buys less distance
;; (ADR 0002), so braking already costs range and needs no reserve of its own. It
;; overrides boost while both are held — the recovery verb wins over the commit one.
brake_speed_multiplier = 0.55      ; [0.1..1] multiplies base_speed while held
brake_turn_multiplier = 1.8        ; [1..4] multiplies turn_rate_deg_per_sec while held

; Gray-box body. Only reason it exists is so the chase cam has something to sit behind.
body_length = 2.56                 ; [0.2..12] m
body_width = 0.4845                ; [0.05..4] m
body_color = "#c9ccd2"
exhaust_length = 2.4               ; [0..12] m, drawn behind the body
exhaust_color = "#5ea8ff"

; Detonation marker. Keep end_radius under camera/missile_follow_distance or the
; camera ends up inside the flash and the screen washes out.
flash_start_radius = 1.5           ; [0.1..20] m
flash_end_radius = 8.67            ; [1..60] m
flash_seconds = 0.45               ; [0.05..3] how long it expands and fades
flash_color = "#ffd9a0"            ; on a hit
flash_color_dud = "#6b7d92"        ; on a fuse expiry


; The mothership under its one autopilot behaviour: a slow arc at standoff with
; the nose held on the target. Not a flight model, not an AI (ADR 0013).
[ship]

;; How fast the ship slides around its target. This is where launch-geometry variety
;; comes from: the faster it arcs, the more sideways the missile is travelling at
;; launch, and the bigger the turn you have to fly.
arc_speed = 13.8                   ; [0..80] m/s along the arc. Drives how much launch geometry varies
;; The range the autopilot tries to hold. Compare against missile reach
;; (base_speed x fuse_seconds): set this beyond reach and every shot expires short no
;; matter how well you fly. Editing this snaps the ship immediately.
standoff_distance = 203.0          ; [50..900] m the autopilot holds. Compare against missile reach!
;; Roughly how long the autopilot takes to correct a range error. Lower is stiffer
;; and holds standoff tighter against the target's drift; higher lets range wander.
;; Steady-state error is about enemy/drift_speed x this value.
range_hold_seconds = 2.4785        ; [0.2..10] how quickly it corrects a range error. Lower = stiffer
;; Ceiling on the closing or backing-off speed the range correction may use. Without
;; it, a large standoff edit reads as the ship charging its target.
range_hold_max_speed = 45.0        ; [1..200] m/s cap on that correction, so it never reads as a charge
;; How far ahead of the ship's origin a missile appears, so it does not spawn inside
;; the hull mesh.
muzzle_offset = 6.0                ; [0..40] m ahead of the ship that a missile appears

;; Manual flight (ADR 0040). T hands the ship between the autopilot and the player.
;; This is the ship's throttle, not the missile's boost: W and S move a lever that
;; STAYS where it is put, so the ship holds its speed when both keys are released.
;; The seconds below are the full travel of that lever end to end.
autopilot_on_start = true          ; false starts every run under manual control
manual_accel_seconds = 3.2         ; [0.1..15] s from a standing start to full throttle
manual_brake_seconds = 2.4         ; [0.1..15] s from full throttle back to a stop
;; Top speed the ship may reach. It is silently clamped to
;; missile/base_speed x manual_speed_ceiling_fraction, because a ship that keeps up
;; with a missile makes the missile pointless — the speed hierarchy in CLAUDE.md is
;; enforced in code, so raising this past the clamp does nothing.
manual_max_speed = 34.0            ; [1..300] m/s at full throttle, before the clamp below
manual_speed_ceiling_fraction = 0.6 ; [0.05..0.95] share of missile speed the ship may reach. THE hierarchy
;; The ship's weight, the same instrument the missile flies with and deliberately a
;; much heavier setting. Compare against missile/turn_rate_deg_per_sec: the gap
;; between them is how different the two vehicles feel to fly.
manual_turn_rate_deg_per_sec = 26.0 ; [3..180] deg/s the ship swings towards the reticle
manual_reticle_max_angle_deg = 55.0 ; [5..90] how far off the nose the ship's reticle can be pushed
;; Lateral thrusters, held rather than a one-press dodge. A ship is not flying a
;; terminal approach, so ADR 0039's objection to a held slide does not apply to it.
manual_strafe_speed = 12.0         ; [0..80] m/s sideways while A or D is held
hull_scale = 2.0                   ; [0.2..12]
hull_tint = "#8f9aa6"
metallic = 0.12                    ; [0..1] keep low: an empty environment gives metal nothing to reflect
roughness = 0.555                  ; [0..1]


; One dumb target. Drifts, turns at its patrol bounds, and nothing else — return
; fire and blockers are POC steps 7 and 8.
[enemy]

;; The target's hit sphere, not its art size. A missile counts as a hit when its
;; flight path passes within this distance of the target's centre.
;;
;; The hull below is drawn from primitives and is NOT hit-tested shape-accurately
;; the way the rocks are (ADR 0041), so keep the art inside this sphere: a wingtip
;; or a nose cone sticking out past it is a part of the ship that visibly cannot be
;; hit, which is exactly the complaint that got the rocks rebuilt. The headless gate
;; checks the components fit; the hull's own proportions are on the human.
radius = 9.0                       ; [1..60] m. This is the hit sphere. Keep the hull art inside it
;; How fast the target wanders. Non-zero drift is what makes the autopilot's
;; range-holding matter, and what stops every launch geometry being identical.
drift_speed = 20.0                 ; [0..60] m/s
spin_deg_per_sec = 6.3             ; [0..180] cosmetic, makes it read as an object not a decal
patrol_half_extent = 300.0         ; [0..800] m from arena centre before it turns around
hull_color = "#c2603f"
hull_emission = 0.89               ; [0..4] high on purpose: it has to be findable at standoff range

;; The hull's shape, in metres. It is built from primitives every reload (ADR 0030),
;; so these are the ship's actual proportions and not a scale factor. A silhouette
;; with a nose and a tail is the point: a cube gives the eye nothing to aim at, so
;; there is no way to tell a shot that was aimed from one that merely arrived.
;; None of this is the hit sphere — that is `radius`, above.
hull_length = 12.0                 ; [2..120] m nose to tail. Keep length/2 + nose under `radius`
hull_width = 5.5                   ; [1..60] m across the fuselage
hull_height = 3.2                  ; [1..40] m top to bottom
nose_length = 5.0                  ; [0..60] m of cone ahead of the fuselage
wing_span = 16.0                   ; [0..160] m tip to tip. Half of this should stay under `radius`
wing_chord = 5.0                   ; [0..60] m front to back
wing_thickness = 0.7               ; [0.1..8] m
fin_height = 3.6                   ; [0..40] m of tail fin above the hull

;; Components (ADR 0042): small cylinders bolted around the hull, each its own hit
;; sphere, tested BEFORE the hull's — so a shot that could count either way is
;; credited to the part that was aimed at. First hit darkens, second destroys.
;; This is the target-practice experiment. Set component_count = 0 to get the
;; single-hit-sphere target back and feel the two side by side.
component_count = 4                ; [0..12] cylinders ringed around the hull
component_hits_to_destroy = 2      ; [1..8] hits each one takes. 1 removes the darkening step
component_radius = 1.3             ; [0.2..12] m of the cylinder
component_length = 3.0             ; [0.5..30] m of the cylinder
component_mount_radius = 2.6       ; [0..40] m out from the hull's spine that they sit
;; The component's hit sphere. Bigger than the cylinder it wraps, on purpose: these
;; are what the player is aiming at, and a hit box tighter than the art turns aiming
;; into a coin toss. Compare against `radius` — much smaller than it, or components
;; are no harder to hit than the hull and the whole experiment says nothing.
component_hit_radius = 2.2         ; [0.2..20] m. Keep it well under enemy/radius
component_damaged_darken = 0.45    ; [0..1] how much darker a damaged component goes
;; How long a destroyed component takes to come back. Without this a practice run
;; is over after a few hits and the loop cannot be felt twice in one session.
;; 0 leaves the target stripped until the tuning file is reloaded.
component_respawn_seconds = 8.0    ; [0..120] s before a destroyed component returns. 0 = never
component_color = "#4fd6a0"
component_emission = 1.4           ; [0..4] they have to read as targets at standoff range


[camera]

fov_base = 70.0                    ; [40..120] degrees
;; How long the camera stays on the detonation before cutting back to the ship. Long
;; enough to read the outcome, short enough not to feel like a cutscene.
return_delay_sec = 0.7             ; [0..4] how long the detonation is watched before cutting back
missile_view_mode = "cut"          ; "cut" is the only mode implemented; PiP is POC step 9

; Ship view. Distance and height are relative to the ship's own axes.
ship_follow_distance = 26.0        ; [3..200] m behind
ship_follow_height = 7.0           ; [-40..60] m above
ship_follow_lag = 6.0              ; [0.5..40] higher = snappier, lower = floatier
ship_look_ahead = 30.0             ; [0..300] m ahead of the ship that the camera aims at

; Missile view. This is the feel-critical one — the 8 seconds happen here.
missile_follow_distance = 7.85     ; [2..80] m behind
missile_follow_height = 2.0        ; [-20..30] m above. Puts the missile low in frame, target above it
;; How hard the missile camera is pinned to the missile. High glues it on and reads
;; as precise; low lets it swing behind on a turn, which reads as speed but costs
;; aiming accuracy. Probably the most feel-critical camera value in the game.
missile_follow_lag = 14.0          ; [0.5..40] snappier than the ship cam; lag reads as sloppy at speed
;; How far in front of the missile the camera aims. Larger pushes the missile lower
;; in frame and shows more of the approach; smaller centres the missile and shows
;; more of what is immediately around it.
missile_look_ahead = 25.5          ; [0..200] m ahead. Lower = missile more centred, less of the approach

; Debug fly-cam, sandbox scene only. Not the game's camera.
free_move_speed = 13.4375          ; [1..200] m/s
free_boost_multiplier = 4.0        ; [1..20] while Shift is held
free_look_sensitivity = 0.1792     ; [0.01..2] degrees per pixel
free_move_smoothing = 11.92        ; [1..40]
start_position = Vector3(8.0, 3.2, -9.5)
start_look_at = Vector3(0.0, 0.0, 0.0)


; Both devices are capped by missile/turn_rate_deg_per_sec, so neither can ask for
; a turn the other cannot.
[controls]

;; Degrees the reticle sweeps per pixel of mouse movement. This moves the RETICLE,
;; not the missile — the missile's own response is missile/turn_rate_deg_per_sec.
mouse_sensitivity = 0.20           ; [0.01..2] degrees of RETICLE movement per pixel of mouse
;; Degrees per second the reticle sweeps at full stick deflection. The gamepad
;; equivalent of mouse_sensitivity; set it near turn_rate_deg_per_sec so a stick and
;; a mouse can ask for roughly the same thing.
stick_reticle_speed_deg_per_sec = 110.0 ; [10..500] deg/s the stick sweeps the reticle
;; Stick movement below this fraction is ignored. Input past it is rescaled from
;; zero, so the first live input is a nudge rather than a jump.
deadzone = 0.1485                  ; [0..0.6] rescaled past the edge, so first input is not a step


[arena]

; Marker lattice: near-field speed reference. Count is per axis, so 7 means 7³.
marker_spacing = 90.0              ; [5..400] m between markers
marker_count_per_axis = 7          ; [1..15] 7³ = 343 markers, one draw call
marker_size = 2.2                  ; [0.1..20] m
marker_color = "#3f6c84"

background_color = "#05070c"
ambient_energy = 0.5               ; [0..4]
glow_enabled = true                ; bloom. The missile exhaust is what it mostly catches
glow_intensity = 0.4               ; [0..3]
key_light_energy = 2.2             ; [0..8]
key_light_angles_deg = Vector3(-30.0, 145.0, 0.0) ; pitch, yaw, roll
fill_light_energy = 0.55           ; [0..8]
fill_light_angles_deg = Vector3(14.0, -35.0, 0.0)

; Reference rocks, and now obstacles too: a missile that touches one dies (ADR 0038).
; Hits are swept-segment sphere tests, never physics bodies — ADR 0032's mechanism
; rule still stands; 0038 supersedes only its "keep them outside the fight" placement
; rule. inner_radius is now deliberately INSIDE the engagement volume. Raise it back
; above ship/standoff_distance to get the old reference-only arena back.
rock_count = 260                   ; [0..600]
rock_inner_radius = 69.8           ; [10..3000] m from arena centre. Inside the fight, on purpose
rock_outer_radius = 1567.4         ; [10..6000] m
rock_slab_half_height = 220.0      ; [0..1500] m above and below the plane
rock_min_size = 8.0                ; [0.5..120] m
rock_max_size = 46.0               ; [0.5..200] m
rock_color = "#6d675c"
rock_seed = 20260823               ; fixed, so the arena is identical between runs
rock_collision = true              ; missiles die on contact. false = scenery only, the pre-ADR-0038 arena

;; Rock shape (ADR 0041). Each rock is a cluster of overlapping ellipsoids: one
;; main lobe on the rock's origin, the rest hung off it at an offset shorter than
;; the main radius, which is what keeps each one less than half exposed. The lobes
;; are BOTH what is drawn and what is hit — there is no separate hit shape to drift
;; out of agreement with the art, which is what the single box used to do at its
;; corners.
rock_lobe_min = 3                  ; [1..10] fewest lobes in a rock
rock_lobe_max = 6                  ; [1..12] most lobes in a rock
rock_lobe_size_min = 0.35          ; [0.05..1] smallest satellite lobe, as a share of the main one
rock_lobe_size_max = 0.7           ; [0.05..1] largest satellite lobe. Above 1 and the "main" lobe is not
rock_lobe_offset_min = 0.45        ; [0..1.5] closest a lobe sits to the centre, in main radii
rock_lobe_offset_max = 0.95        ; [0..1.5] furthest. Above 1 exposes more than half the lobe
;; Per-axis stretch on every lobe. 0 gives perfect spheres, which read as a pile of
;; balls; the jitter is what makes the cluster look quarried.
rock_elongation = 0.45             ; [0..0.9] how far from spherical each lobe is
;; Hit size against drawn size. 1.0 means the rock is exactly as solid as it looks,
;; which is the point of the cluster — it was 0.55 when rocks were boxes and the
;; corners had to be forgiven. Under 1 lets a missile clip a silhouette and live.
rock_hit_radius_scale = 1.0        ; [0.1..1.5] hit shape vs drawn shape. 1.0 = what you see is what you hit


; Sandbox scene only — the asset-inspection harness, not the game.
[probe]

scale = 2.0                        ; [0.1..12]
spin_deg_per_sec = 18.45           ; [0..180]
bob_amplitude = 0.6                ; [0..20] m
bob_period_sec = 6.0               ; [0.2..40]
hull_tint = "#8f9aa6"
metallic = 0.12                    ; [0..1]
roughness = 0.5475                 ; [0..1]


; Screen-space instruments. The target indicator exists because the ship points
; along its own velocity now and not at the target; the reticle exists because
; the missile lags behind where you asked it to go.
[hud]

font_size = 14                     ; [8..40]
line_width = 2.0                   ; [0.5..8]

target_color = "#ff9a52"
target_bracket_size = 39.68        ; [8..200] px across, when the target is on screen
arrow_size = 18.25                 ; [4..80] px, the off-screen pointer
edge_margin = 34.0                 ; [0..200] px kept clear at the screen edge

reticle_color = "#7ce0ff"
reticle_size = 17.0                ; [3..80] px radius
reticle_distance = 60.0            ; [5..400] m ahead of the missile that the reticle is drawn
reticle_lag_line_alpha = 0.35      ; [0..1] the nose-to-reticle line. 0 hides it
